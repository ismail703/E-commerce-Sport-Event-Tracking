version: '3.8'

# 1. E-commerce Application
services:
  ecommerce-app:
      build: 
        context: .
        dockerfile: Dockerfile
      container_name: ecommerce
      ports:
        - "3000:3000"
      volumes:
        - shared-logs:/ecommerce-app/logs
      networks:
        - etl-net

  # 2. Apache NiFi
  nifi:
    image: apache/nifi:latest
    container_name: nifi
    user: root
    ports:
      - "8443:8443"
    environment:    
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=Password123!
    volumes:
      - shared-logs:/var/log/ecommerce
    networks:
      - etl-net

  # 3. MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=Password123!
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - etl-net


  #4. ClickHouse Database
  clickhouse:
      image: clickhouse/clickhouse-server:latest
      container_name: clickhouse
      ports:
        - "8123:8123" # HTTP port (for UI/JDBC)
        - "9004:9000"
      environment:
        - CLICKHOUSE_USER=admin
        - CLICKHOUSE_PASSWORD=Password123!
      volumes:
        - clickhouse-data:/var/lib/clickhouse
        - ./keeper.xml:/etc/clickhouse-server/config.d/keeper.xml
      networks:
        - etl-net    

volumes:
  shared-logs:
  minio-data:
  clickhouse-data:

networks:
  etl-net:
    driver: bridge      